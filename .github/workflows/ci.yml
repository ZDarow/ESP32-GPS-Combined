name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install linters
        run: pip install ruff markdownlint-cli

      - name: Ruff Lint
        run: ruff check .

      - name: Markdown Lint
        run: markdownlint '**/*.md' || true

      - name: Python tests (NMEA parser)
        run: |
          cd esp32-firmware
          pip install pytest
          python -m pytest tests/test_nmea_parser.py -v
