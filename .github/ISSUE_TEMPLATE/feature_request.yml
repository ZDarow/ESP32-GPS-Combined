name: Feature Request

description: Suggest a new feature or enhancement

body:
  - type: markdown
    attributes:
      value: |
        ## Feature Description
        A clear and concise description of the feature you'd like to request.

  - type: textarea
    id: feature
    attributes:
      label: Feature
      description: What feature would you like to see?
      placeholder: Describe your feature request...
    validations:
      required: true

  - type: textarea
    id: motivation
    attributes:
      label: Motivation
      description: Why is this feature useful? What problem does it solve?
      placeholder: |

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Any alternatives you've considered?
      placeholder: |

  - type: dropdown
    id: component
    attributes:
      label: Target Component
      options:
        - ESP32 Firmware
        - Android App
        - Documentation
        - Other
    validations:
      required: true

  - type: checkboxes
    id: checkbox
    attributes:
      label: Checklist
      options:
        - label: I have searched existing feature requests
          required: true
        - label: I am willing to help implement this feature
